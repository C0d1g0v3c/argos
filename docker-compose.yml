services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: argos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argos}
      POSTGRES_USER: ${POSTGRES_USER:-argos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # El esquema se aplica solo la primera vez que se crea el volumen.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argos} -d ${POSTGRES_DB:-argos}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
